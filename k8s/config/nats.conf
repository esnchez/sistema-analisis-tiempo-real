# NATS con JetStream: monitorización HTTP en :8222 y persistencia en /data.
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  # Tope de disco de JetStream: dimensionar para la peor caída asumible
  # (docs/servicio/fallos-y-reintentos.md). Debe caber en el PVC (10 Gi).
  max_file_store: 8GB
}
