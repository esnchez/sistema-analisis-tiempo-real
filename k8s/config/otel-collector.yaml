# Pipeline de métricas: OTLP → (memory_limiter, batch) → endpoint Prometheus.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Primero: rechaza datos antes de quedarse sin memoria.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Series de pods que ya no existen (rolling update, escalado) dejan de exponerse.
    metric_expiration: 5m

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
