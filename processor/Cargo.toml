[package]
name = "data-processor"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
async-nats = "0.50.0"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
clickhouse = { version = "0.15.2", features = ["chrono", "uuid"] }
fastrand = "2.5.0"
futures-util = "0.3.34"
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["metrics", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "rt-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.27.0", features = ["v7", "serde"] }

[dev-dependencies]
clickhouse = { version = "0.15.2", features = ["test-util"] }
tokio = { version = "1.53.2", features = ["test-util", "macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
